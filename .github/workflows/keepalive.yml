name: Play.Hosting Auto Keepalive

on:
  schedule:
    # UTC 00:00 和 12:00 = 北京时间 08:00 和 20:00
    - cron: "0 0,12 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sing-box
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_JSON=$(curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/SagerNet/sing-box/releases/latest)
          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | python3 -c "import sys, json; assets = json.load(sys.stdin)['assets']; print(next(a['browser_download_url'] for a in assets if a['name'].endswith('-linux-amd64.tar.gz')))")
          echo "Downloading: $DOWNLOAD_URL"
          curl -sSL "$DOWNLOAD_URL" -o /tmp/sing-box.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo mv /tmp/sing-box-*/sing-box /usr/local/bin/sing-box
          sudo chmod +x /usr/local/bin/sing-box
          sing-box version

      - name: Install dependencies and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install --upgrade pip
          pip install -r requirements.txt
          patchright install chromium
          patchright install-deps chromium

      - name: Run Play.Hosting Keeper
        env:
          PLAY_EMAIL: ${{ secrets.PLAY_EMAIL }}
          PLAY_PASSWORD: ${{ secrets.PLAY_PASSWORD }}
          PLAY_SERVER_ID: ${{ secrets.PLAY_SERVER_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run -a --server-args="-screen 0 1366x768x24" python main.py

      - name: Upload result screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-hosting-screenshot
          path: result.png
          if-no-files-found: ignore
          retention-days: 3
